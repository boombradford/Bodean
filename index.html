<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bo Dean — STL Made</title>
  <meta name="description" content="Bo Dean — STL Made. Listen now.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: rgba(12, 12, 18, 0.85);
      --cardinals-red: #C41E3A;
      --cardinals-red-glow: rgba(196, 30, 58, 0.35);
      --cardinals-navy: #0C2340;
      --accent: #C41E3A;
      --accent-glow: rgba(196, 30, 58, 0.3);
      --text-primary: #f0ece4;
      --text-secondary: #8a8694;
      --text-muted: #5a5666;
      --border: rgba(255, 255, 255, 0.08);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Hero Section ── */
    .hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
    }

    /* Background glow behind art */
    .hero::before {
      content: '';
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 120%;
      height: 60%;
      background: radial-gradient(ellipse at center, var(--cardinals-red-glow) 0%, rgba(196, 30, 58, 0.08) 40%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40%;
      background: linear-gradient(to top, var(--bg-primary) 0%, transparent 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* ── STL Badge ── */
    .stl-badge {
      position: relative;
      z-index: 2;
      margin-top: clamp(1.5rem, 4vw, 3rem);
      text-align: center;
      opacity: 0;
      transform: translateY(-10px);
      animation: fadeIn 0.5s ease 0.1s forwards;
    }

    .stl-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--cardinals-red);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    .stl-text::before,
    .stl-text::after {
      content: '';
      width: 30px;
      height: 1px;
      background: var(--cardinals-red);
      opacity: 0.5;
    }

    /* ── Artist Name ── */
    .artist-header {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-top: 0.5rem;
      opacity: 0;
      transform: translateY(-10px);
      animation: fadeIn 0.5s ease 0.2s forwards;
    }

    .artist-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.5rem, 14vw, 7rem);
      letter-spacing: 0.12em;
      line-height: 0.9;
      color: var(--text-primary);
      text-transform: uppercase;
    }

    .artist-subtitle {
      font-size: 0.75rem;
      font-weight: 300;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-top: 0.5rem;
    }

    /* ── Hero Album Art (THE CENTERPIECE) ── */
    .hero-artwork {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 520px;
      margin: clamp(1.5rem, 4vw, 2.5rem) auto 0;
      opacity: 0;
      transform: scale(0.95);
      animation: artReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }

    .artwork-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      overflow: hidden;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.05),
        0 0 120px var(--cardinals-red-glow);
      transition: box-shadow 0.4s ease;
    }

    .artwork-frame.is-playing {
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.05),
        0 0 160px var(--cardinals-red-glow),
        0 0 60px rgba(196, 30, 58, 0.15);
    }

    .artwork-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .artwork-frame.is-playing img {
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.06); }
    }

    @keyframes artReveal {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ── 314 Watermark ── */
    .watermark-314 {
      position: absolute;
      bottom: -5%;
      right: -3%;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(8rem, 25vw, 14rem);
      color: rgba(196, 30, 58, 0.04);
      line-height: 1;
      pointer-events: none;
      z-index: 0;
      letter-spacing: 0.05em;
    }

    /* ── Player (overlaid at bottom of hero) ── */
    .player-section {
      position: relative;
      z-index: 3;
      width: 90%;
      max-width: 520px;
      margin: clamp(1.5rem, 3vw, 2rem) auto 0;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeIn 0.6s ease 0.5s forwards;
    }

    .player-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
    }

    .track-info {
      text-align: center;
      margin-bottom: 1.25rem;
    }

    .track-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.08em;
      color: var(--text-primary);
    }

    .track-artist {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 300;
      margin-top: 0.15rem;
    }

    /* Progress Bar */
    .progress-group {
      margin-bottom: 1.25rem;
    }

    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
      transition: height 0.15s ease;
    }

    .progress-bar-container:hover {
      height: 6px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--cardinals-red);
      border-radius: 2px;
      width: 0%;
      position: relative;
      transition: width 0.1s linear;
    }

    .progress-bar-fill::after {
      content: '';
      position: absolute;
      right: -5px;
      top: 50%;
      transform: translateY(-50%) scale(0);
      width: 10px;
      height: 10px;
      background: var(--cardinals-red);
      border-radius: 50%;
      transition: transform 0.15s ease;
    }

    .progress-bar-container:hover .progress-bar-fill::after {
      transform: translateY(-50%) scale(1);
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      margin-top: 0.5rem;
      font-size: 0.7rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }

    .btn-control {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      padding: 0.5rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-control:hover {
      color: var(--text-primary);
    }

    .btn-control svg {
      width: 20px;
      height: 20px;
    }

    .btn-play {
      width: 56px;
      height: 56px;
      background: var(--cardinals-red);
      color: #fff;
      border-radius: 50%;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px var(--cardinals-red-glow);
    }

    .btn-play:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 30px var(--cardinals-red-glow);
    }

    .btn-play:active {
      transform: scale(0.97);
    }

    .btn-play svg {
      width: 24px;
      height: 24px;
    }

    /* Volume */
    .volume-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 1.25rem;
    }

    .volume-group svg {
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: var(--text-secondary);
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.2s;
    }

    .volume-slider::-webkit-slider-thumb:hover {
      background: var(--text-primary);
    }

    .volume-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      background: var(--text-secondary);
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }

    /* ── Social Links ── */
    .social-section {
      position: relative;
      z-index: 3;
      width: 90%;
      max-width: 520px;
      margin: 2rem auto 0;
      display: flex;
      justify-content: center;
      gap: 1rem;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeIn 0.6s ease 0.6s forwards;
    }

    .social-link {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .social-link:hover {
      border-color: var(--cardinals-red);
      color: var(--cardinals-red);
      transform: translateY(-2px);
    }

    .social-link svg {
      width: 18px;
      height: 18px;
    }

    /* ── STL Footer Stripe ── */
    .stl-footer {
      position: relative;
      z-index: 3;
      width: 90%;
      max-width: 520px;
      margin: 2.5rem auto 0;
      padding: 1.5rem 0;
      border-top: 1px solid var(--border);
      text-align: center;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeIn 0.6s ease 0.7s forwards;
    }

    .stl-footer-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.35em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .stl-footer-text .red {
      color: var(--cardinals-red);
    }

    .stl-footer p {
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      margin-top: 0.5rem;
    }

    .bottom-spacer {
      height: 3rem;
    }

    /* ── Responsive ── */
    @media (min-width: 768px) {
      .hero-artwork {
        max-width: 560px;
      }

      .artwork-frame {
        border-radius: 20px;
      }

      .player-card {
        padding: 2rem;
      }
    }

    @media (max-width: 360px) {
      .player-card {
        padding: 1.25rem;
      }

      .controls {
        gap: 1rem;
      }

      .btn-play {
        width: 50px;
        height: 50px;
      }
    }

    /* ── Animations ── */
    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="hero">

    <!-- 314 Watermark -->
    <div class="watermark-314">314</div>

    <!-- STL Badge -->
    <div class="stl-badge">
      <div class="stl-text">STL Made</div>
    </div>

    <!-- Artist Name -->
    <header class="artist-header">
      <h1 class="artist-name">Bo Dean</h1>
      <p class="artist-subtitle">Saint Louis, Missouri</p>
    </header>

    <!-- HERO ALBUM ART -->
    <section class="hero-artwork">
      <div class="artwork-frame" id="artwork">
        <img
          src="assets/cover.png"
          alt="Bo Dean — Album Cover"
          onerror="this.parentElement.innerHTML='<div style=\'width:100%;height:100%;background:linear-gradient(145deg,#1a1525,#0d0b14);display:flex;align-items:center;justify-content:center;color:#5a5666;font-size:0.8rem;letter-spacing:0.1em\'>Cover art loading...</div>'"
        >
      </div>
    </section>

    <!-- Player -->
    <section class="player-section">
      <div class="player-card">

        <div class="track-info">
          <div class="track-title" id="track-title">STL Made Ya</div>
          <div class="track-artist">Bo Dean</div>
        </div>

        <div class="progress-group">
          <div class="progress-bar-container" id="progress-bar">
            <div class="progress-bar-fill" id="progress-fill"></div>
          </div>
          <div class="time-display">
            <span id="time-current">0:00</span>
            <span id="time-duration">0:00</span>
          </div>
        </div>

        <div class="controls">
          <button class="btn-control" id="btn-rewind" title="Rewind 10s">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="1 4 1 10 7 10"/>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
            </svg>
          </button>

          <button class="btn-control btn-play" id="btn-play" title="Play / Pause">
            <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="6,3 20,12 6,21"/>
            </svg>
            <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
              <rect x="5" y="3" width="4" height="18"/>
              <rect x="15" y="3" width="4" height="18"/>
            </svg>
          </button>

          <button class="btn-control" id="btn-forward" title="Forward 10s">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
          </button>
        </div>

        <div class="volume-group">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
          <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
        </div>

      </div>
    </section>

    <!-- Socials -->
    <nav class="social-section">
      <!-- Instagram -->
      <a href="#" class="social-link" title="Instagram" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
        </svg>
      </a>

        </svg>

      </a>
      <!-- SoundCloud -->

  <!-- Audio Element -->
  <audio id="audio" preload="auto" src="assets/track.mp3"></audio>

  <script>
    (function() {
      const audio = document.getElementById('audio');
      const btnPlay = document.getElementById('btn-play');
      const iconPlay = document.getElementById('icon-play');
      const iconPause = document.getElementById('icon-pause');
      const btnRewind = document.getElementById('btn-rewind');
      const btnForward = document.getElementById('btn-forward');
      const progressBar = document.getElementById('progress-bar');
      const progressFill = document.getElementById('progress-fill');
      const timeCurrent = document.getElementById('time-current');
      const timeDuration = document.getElementById('time-duration');
      const volumeSlider = document.getElementById('volume-slider');
      const artwork = document.getElementById('artwork');

      function formatTime(seconds) {
        if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
        var mins = Math.floor(seconds / 60);
        var secs = Math.floor(seconds % 60);
        return mins + ':' + (secs < 10 ? '0' : '') + secs;
      }

      audio.volume = 0.8;
      volumeSlider.addEventListener('input', function() {
        audio.volume = this.value;
      });

      btnPlay.addEventListener('click', function() {
        if (audio.paused) {
          audio.play();
        } else {
          audio.pause();
        }
      });

      audio.addEventListener('play', function() {
        iconPlay.style.display = 'none';
        iconPause.style.display = 'block';
        artwork.classList.add('is-playing');
      });

      audio.addEventListener('pause', function() {
        iconPlay.style.display = 'block';
        iconPause.style.display = 'none';
        artwork.classList.remove('is-playing');
      });

      audio.addEventListener('timeupdate', function() {
        var pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = pct + '%';
        timeCurrent.textContent = formatTime(audio.currentTime);
      });

      audio.addEventListener('loadedmetadata', function() {
        timeDuration.textContent = formatTime(audio.duration);
      });

      audio.addEventListener('ended', function() {
        progressFill.style.width = '0%';
        timeCurrent.textContent = '0:00';
        iconPlay.style.display = 'block';
        iconPause.style.display = 'none';
        artwork.classList.remove('is-playing');
      });

      progressBar.addEventListener('click', function(e) {
        var rect = this.getBoundingClientRect();
        var pct = (e.clientX - rect.left) / rect.width;
        audio.currentTime = pct * audio.duration;
      });

      progressBar.addEventListener('touchstart', handleTouch, { passive: true });
      progressBar.addEventListener('touchmove', handleTouch, { passive: true });

      function handleTouch(e) {
        var touch = e.touches[0];
        var rect = progressBar.getBoundingClientRect();
        var pct = Math.max(0, Math.min(1, (touch.clientX - rect.left) / rect.width));
        audio.currentTime = pct * audio.duration;
      }

      btnRewind.addEventListener('click', function() {
        audio.currentTime = Math.max(0, audio.currentTime - 10);
      });

      btnForward.addEventListener('click', function() {
        audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
      });

      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT') return;
        switch(e.code) {
          case 'Space':
            e.preventDefault();
            btnPlay.click();
            break;
          case 'ArrowLeft':
            audio.currentTime = Math.max(0, audio.currentTime - 5);
            break;
          case 'ArrowRight':
            audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
            break;
          case 'ArrowUp':
            e.preventDefault();
            audio.volume = Math.min(1, audio.volume + 0.05);
            volumeSlider.value = audio.volume;
            break;
          case 'ArrowDown':
            e.preventDefault();
            audio.volume = Math.max(0, audio.volume - 0.05);
            volumeSlider.value = audio.volume;
            break;
        }
      });
    })();
  </script>
