<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bo Dean — Official</title>
  <meta name="description" content="Bo Dean — Listen now.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a25;
      --accent: #d4a053;
      --accent-glow: rgba(212, 160, 83, 0.3);
      --text-primary: #f0ece4;
      --text-secondary: #8a8694;
      --text-muted: #5a5666;
      --border: rgba(255, 255, 255, 0.06);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Ambient Background ── */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .ambient-bg::before {
      content: '';
      position: absolute;
      top: -30%;
      left: -20%;
      width: 70%;
      height: 70%;
      background: radial-gradient(ellipse, rgba(212, 160, 83, 0.06) 0%, transparent 70%);
      animation: drift 20s ease-in-out infinite;
    }

    .ambient-bg::after {
      content: '';
      position: absolute;
      bottom: -20%;
      right: -20%;
      width: 60%;
      height: 60%;
      background: radial-gradient(ellipse, rgba(90, 60, 140, 0.05) 0%, transparent 70%);
      animation: drift 25s ease-in-out infinite reverse;
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(40px, 20px); }
    }

    /* ── Layout ── */
    .page-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1.25rem 4rem;
    }

    /* ── Header ── */
    .site-header {
      width: 100%;
      max-width: 600px;
      text-align: center;
      padding: 1.5rem 0 1rem;
    }

    .artist-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 10vw, 5.5rem);
      letter-spacing: 0.15em;
      line-height: 1;
      color: var(--text-primary);
      text-transform: uppercase;
      position: relative;
      display: inline-block;
    }

    .artist-name::after {
      content: '';
      display: block;
      width: 40px;
      height: 2px;
      background: var(--accent);
      margin: 0.75rem auto 0;
    }

    .tagline {
      font-size: 0.8rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-top: 0.75rem;
    }

    /* ── Album Art ── */
    .artwork-section {
      width: 100%;
      max-width: 440px;
      margin: 2rem auto;
    }

    .artwork-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      overflow: hidden;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 80px rgba(212, 160, 83, 0.05);
    }

    .artwork-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .artwork-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #1a1525 0%, #0d0b14 50%, #1a1520 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
    }

    .artwork-placeholder svg {
      width: 64px;
      height: 64px;
      opacity: 0.3;
    }

    .artwork-placeholder span {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
    }

    /* Vinyl spin animation when playing */
    .artwork-container.is-playing img {
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.05); }
    }

    /* ── Audio Player ── */
    .player-section {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }

    .player-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      backdrop-filter: blur(20px);
    }

    .track-info {
      text-align: center;
      margin-bottom: 1.25rem;
    }

    .track-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.08em;
      color: var(--text-primary);
    }

    .track-artist {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 300;
      margin-top: 0.15rem;
    }

    /* Progress Bar */
    .progress-group {
      margin-bottom: 1.25rem;
    }

    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
      transition: height 0.15s ease;
    }

    .progress-bar-container:hover {
      height: 6px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      width: 0%;
      position: relative;
      transition: width 0.1s linear;
    }

    .progress-bar-fill::after {
      content: '';
      position: absolute;
      right: -5px;
      top: 50%;
      transform: translateY(-50%) scale(0);
      width: 10px;
      height: 10px;
      background: var(--accent);
      border-radius: 50%;
      transition: transform 0.15s ease;
    }

    .progress-bar-container:hover .progress-bar-fill::after {
      transform: translateY(-50%) scale(1);
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      margin-top: 0.5rem;
      font-size: 0.7rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }

    .btn-control {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      padding: 0.5rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-control:hover {
      color: var(--text-primary);
    }

    .btn-control svg {
      width: 20px;
      height: 20px;
    }

    .btn-play {
      width: 56px;
      height: 56px;
      background: var(--accent);
      color: var(--bg-primary);
      border-radius: 50%;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .btn-play:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 30px var(--accent-glow);
    }

    .btn-play:active {
      transform: scale(0.97);
    }

    .btn-play svg {
      width: 24px;
      height: 24px;
    }

    /* Volume */
    .volume-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-top: 1.25rem;
    }

    .volume-group svg {
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: var(--text-secondary);
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.2s;
    }

    .volume-slider::-webkit-slider-thumb:hover {
      background: var(--text-primary);
    }

    .volume-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      background: var(--text-secondary);
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }

    /* ── Social Links ── */
    .social-section {
      width: 100%;
      max-width: 440px;
      margin: 2.5rem auto 0;
      display: flex;
      justify-content: center;
      gap: 1rem;
    }

    .social-link {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .social-link:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    .social-link svg {
      width: 18px;
      height: 18px;
    }

    /* ── Footer ── */
    .site-footer {
      width: 100%;
      max-width: 440px;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    .site-footer p {
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    /* ── Responsive ── */
    @media (min-width: 768px) {
      .page-wrapper {
        padding: 3rem 2rem 5rem;
        justify-content: center;
      }

      .player-card {
        padding: 2rem;
      }

      .artwork-container {
        border-radius: 16px;
      }
    }

    @media (max-width: 360px) {
      .page-wrapper {
        padding: 1.5rem 1rem 3rem;
      }

      .player-card {
        padding: 1.25rem;
      }

      .controls {
        gap: 1rem;
      }

      .btn-play {
        width: 50px;
        height: 50px;
      }
    }

    /* ── Animations ── */
    .fade-in {
      opacity: 0;
      transform: translateY(12px);
      animation: fadeIn 0.6s ease forwards;
    }

    .fade-in:nth-child(2) { animation-delay: 0.1s; }
    .fade-in:nth-child(3) { animation-delay: 0.2s; }
    .fade-in:nth-child(4) { animation-delay: 0.3s; }
    .fade-in:nth-child(5) { animation-delay: 0.4s; }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

  <script>
    (function() {
      const audio = document.getElementById('audio');
      const btnPlay = document.getElementById('btn-play');
      const iconPlay = document.getElementById('icon-play');
      const iconPause = document.getElementById('icon-pause');
      const btnRewind = document.getElementById('btn-rewind');
      const btnForward = document.getElementById('btn-forward');
      const progressBar = document.getElementById('progress-bar');
      const progressFill = document.getElementById('progress-fill');
      const timeCurrent = document.getElementById('time-current');
      const timeDuration = document.getElementById('time-duration');
      const volumeSlider = document.getElementById('volume-slider');
      const artwork = document.getElementById('artwork');

      // Format time mm:ss
      function formatTime(seconds) {
        if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
        var mins = Math.floor(seconds / 60);
        var secs = Math.floor(seconds % 60);
        return mins + ':' + (secs < 10 ? '0' : '') + secs;
      }

      // Volume
      audio.volume = 0.8;
      volumeSlider.addEventListener('input', function() {
        audio.volume = this.value;
      });

      // Play / Pause
      btnPlay.addEventListener('click', function() {
        if (audio.paused) {
          audio.play();
        } else {
          audio.pause();
        }
      });

      audio.addEventListener('play', function() {
        iconPlay.style.display = 'none';
        iconPause.style.display = 'block';
        artwork.classList.add('is-playing');
      });

      audio.addEventListener('pause', function() {
        iconPlay.style.display = 'block';
        iconPause.style.display = 'none';
        artwork.classList.remove('is-playing');
      });

      // Time update
      audio.addEventListener('timeupdate', function() {
        var pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = pct + '%';
        timeCurrent.textContent = formatTime(audio.currentTime);
      });

      audio.addEventListener('loadedmetadata', function() {
        timeDuration.textContent = formatTime(audio.duration);
      });

      audio.addEventListener('ended', function() {
        progressFill.style.width = '0%';
        timeCurrent.textContent = '0:00';
        iconPlay.style.display = 'block';
        iconPause.style.display = 'none';
        artwork.classList.remove('is-playing');
      });

      // Seek
      progressBar.addEventListener('click', function(e) {
        var rect = this.getBoundingClientRect();
        var pct = (e.clientX - rect.left) / rect.width;
        audio.currentTime = pct * audio.duration;
      });

      // Touch seek for mobile
      progressBar.addEventListener('touchstart', handleTouch, { passive: true });
      progressBar.addEventListener('touchmove', handleTouch, { passive: true });

      function handleTouch(e) {
        var touch = e.touches[0];
        var rect = progressBar.getBoundingClientRect();
        var pct = Math.max(0, Math.min(1, (touch.clientX - rect.left) / rect.width));
        audio.currentTime = pct * audio.duration;
      }

      // Rewind / Forward
      btnRewind.addEventListener('click', function() {
        audio.currentTime = Math.max(0, audio.currentTime - 10);
      });

      btnForward.addEventListener('click', function() {
        audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
      });

      // Keyboard controls
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT') return;
        switch(e.code) {
          case 'Space':
            e.preventDefault();
            btnPlay.click();
            break;
          case 'ArrowLeft':
            audio.currentTime = Math.max(0, audio.currentTime - 5);
            break;
          case 'ArrowRight':
            audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
            break;
          case 'ArrowUp':
            e.preventDefault();
            audio.volume = Math.min(1, audio.volume + 0.05);
            volumeSlider.value = audio.volume;
            break;
          case 'ArrowDown':
            e.preventDefault();
            audio.volume = Math.max(0, audio.volume - 0.05);
            volumeSlider.value = audio.volume;
            break;
        }
      });
    })();
  </script>

</body>
</html>
